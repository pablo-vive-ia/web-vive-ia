# Config de nginx para el contenedor de producción (VPS DigitalOcean +
# Easypanel). Reemplaza el default.conf que trae la imagen nginx:alpine.
# TLS se termina en el reverse proxy de Easypanel (Traefik); este contenedor
# solo sirve HTTP en :80 puertas adentro — los headers de acá viajan igual
# hasta el browser porque el proxy los reenvía sin tocarlos.

# ── Link header para agent discovery (RFC 8288 / RFC 9727) ─────────────────
# Solo en el home ("/"): apunta a llms.txt, el resumen de VIVE-IA pensado
# para que agentes/LLMs lo lean. rel="service-doc" y no "api-catalog" porque
# no exponemos una API pública que catalogar.
# Usa $request_uri (la URL original del cliente) y no $uri, porque el bloque
# de Markdown for Agents más abajo reescribe $uri internamente y eso rompería
# el match si dependiera de $uri.
map $request_uri $link_header {
  default "";
  /       "</llms.txt>; rel=\"service-doc\"";
}

# ── Markdown for Agents ──────────────────────────────────────────────────
# Si el Accept del request pide text/markdown, servimos el .md generado en
# build (ver scripts/generate-markdown.mjs) en vez del HTML. HTML sigue
# siendo la respuesta default para todo lo demás.
map $http_accept $wants_md {
  default                0;
  "~*text/markdown"      1;
}

server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # No servir dotfiles (.htaccess heredado de un intento de deploy en Apache,
  # y cualquier otro archivo oculto que termine en el build) — EXCEPTO
  # /.well-known/, que es un namespace público estándar (RFC 8615), no un
  # archivo oculto. Sin este negative lookahead, cualquier ruta bajo
  # /.well-known/ (agent discovery, security.txt, etc.) devolvía 403 en vez
  # del 404 normal para lo que no existe.
  location ~ ^/\.(?!well-known/) {
    deny all;
  }

  # ── Headers de seguridad (todas las respuestas) ───────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # script-src sin 'unsafe-inline': todos los <script> del sitio son externos
  # same-origin (bundle de Astro/Vite) o de cdnjs.cloudflare.com. Los bloques
  # <script type="application/ld+json"> (JSON-LD) no ejecutan como JS, así
  # que no están sujetos a script-src y no necesitan excepción.
  # style-src sí mantiene 'unsafe-inline' por el uso de style="" inline y
  # gradientes de texto en varias secciones (deuda pendiente de refactor).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdnjs.cloudflare.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; frame-src https://www.youtube.com; connect-src 'self' https://n8n.vive-ia.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

  add_header Link $link_header always;

  # Reescritura interna hacia el .md correspondiente cuando el cliente pide
  # markdown. `rewrite ... last` es uno de los pocos usos de `if` a nivel
  # server que nginx considera seguros (relanza el matching de location, así
  # el bloque de abajo sí le pone el Content-Type correcto al .md).
  if ($wants_md) {
    rewrite ^/$ /index.md last;
    rewrite ^/(contacto|desarrollos|quienes-somos)/?$ /$1.md last;
    rewrite ^/soluciones/(ecommerce|mentores-marcas-personales)/?$ /soluciones/$1.md last;
  }

  location ~ \.md$ {
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
